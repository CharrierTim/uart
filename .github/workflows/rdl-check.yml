name: SystemRDL-check
on:
  push:
    branches:
      - main
    paths:
      - "tools/peakrdl/**"
      - ".github/workflows/rdl-check.yml"
  pull_request:
    paths:
      - "tools/peakrdl/**"
      - ".github/workflows/rdl-check.yml"

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync

      - name: Check SystemRDL formatting
        run: uv run rdlfmt --check .
